[settings]
quiet = true
task_output = "interleave"
experimental = true

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
bun = "1.3.14"
"shiv:codebase" = "0.4"
"shiv:readme" = "0.3"

[_.codebase]
name = "gay"
lint = ["@all"]
# Gay uses Bun tests; the canonical BATS task contract does not apply.
lint_exclude = ["bats-test-task"]
